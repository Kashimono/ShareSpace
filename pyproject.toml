[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharespace"
description = "Offline-first wireless file sharing for Windows and Linux"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.7,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.47,<1",
    "httpx>=0.27,<1",
    "websockets>=15,<16",
    "zeroconf>=0.132,<1",
    "psutil>=5.9,<8",
    "pydantic>=2.7,<3",
    "cryptography>=42,<50",
    "watchdog>=4,<8",
    "winrt-Windows.Devices.WiFi>=4.0; platform_system == 'Windows'",
    "winrt-Windows.Foundation>=4.0; platform_system == 'Windows'",
    "winrt-Windows.Foundation.Metadata>=4.0; platform_system == 'Windows'",
    "winrt-Windows.Networking.Connectivity>=4.0; platform_system == 'Windows'",
    "winrt-Windows.Networking.NetworkOperators>=4.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
sharespace = "sharespace.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "sharespace.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
